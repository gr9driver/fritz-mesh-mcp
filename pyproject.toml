[project]
name = "fritz-mesh-mcp"
version = "0.1.0"
description = "Local MCP for a FRITZ!Box mesh: radio settings, band steering, and DHCP reservations."
requires-python = ">=3.11"
dependencies = ["mcp>=1.9", "fritzconnection>=1.14"]

[project.scripts]
fritz-mesh-mcp = "fritz_mesh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fritz_mesh_mcp"]

[tool.uv]
package = true
